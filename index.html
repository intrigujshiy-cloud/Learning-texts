<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Learning Game - 15 Levels Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Amatic+SC:wght@700&family=Balsamiq+Sans&family=Caveat:wght@700&family=Chewy&family=Comic+Neue:wght@700&family=Comfortaa:wght@700&family=Fredoka:wght@500&family=Itim&family=Mali:wght@700&family=Marck+Script&family=Neucha&family=Nunito:wght@700&family=Pacifico&family=Pangolin&family=Patrick+Hand&family=Press+Start+2P&family=Quicksand:wght@700&family=Russo+One&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1a1a2e; -webkit-user-select: none; user-select: none; color: white; transition: font-family 0.3s, background 0.5s; perspective: 1000px; background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;}
        button, input, textarea, .word-card, .nav-dot, .gap, .sentence-block { font-family: inherit; }
        
        #bg-canvas, #trail-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bg-canvas { z-index: 0; } #trail-canvas { z-index: 9998; }

        /* ПАНЕЛЬ АДМИНА */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%); z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #00f2ff; font-family: sans-serif;}
        .lock-icon { font-size: 60px; margin-bottom: 20px; }
        .auth-box { background: rgba(20, 20, 30, 0.9); padding: 40px; border-radius: 20px; border: 2px solid #333; text-align: center; width: 300px; }
        .auth-input { width: 100%; padding: 15px; background: #000; border: 1px solid #444; color: #00f2ff; font-size: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; outline: none; letter-spacing: 5px; box-sizing: border-box; }
        .auth-btn { width: 100%; padding: 15px; background: #00f2ff; color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        #errMsg { color: #ff0055; margin-top: 15px; display: none; }

        #panel { position: absolute; left: 10px; top: 10px; width: 420px; background: rgba(0,0,0,0.95); padding: 20px; border-radius: 15px; z-index: 10000; border: 1px solid #444; max-height: 95vh; overflow-y: auto; display: none; font-family: sans-serif; box-shadow: 0 0 30px rgba(0,0,0,0.8); box-sizing: border-box;}
        .input-wrap { position: relative; margin-bottom: 12px; }
        label { font-size: 11px; color: #aaa; margin-bottom: 3px; display: block; text-transform: uppercase;}
        input[type="text"], input[type="number"], textarea, select { width: 100%; background: #222; color: white; border: 1px solid #555; padding: 8px 25px 8px 10px; box-sizing: border-box; border-radius: 8px; font-family: inherit; }
        textarea { height: 50px; resize: vertical; }
        .clear-btn { position: absolute; right: 5px; top: 18px; background: none; border: none; color: #888; cursor: pointer; font-size: 18px; font-weight: bold; padding: 0 5px; line-height: 1; z-index: 5; }
        .clear-btn:hover { color: #ff4757; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .levels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: #111; padding: 10px; border-radius: 8px; margin-bottom: 12px;}
        .levels-grid label { font-size: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #fff; text-transform: none;}
        .colors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; background: #111; padding: 10px; border-radius: 8px; }
        input[type="color"] { width: 100%; height: 30px; border: none; cursor: pointer; background: none; }
        .action-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; text-transform: uppercase; font-size: 14px;}
        .action-btn:hover { filter: brightness(1.2); transform: scale(1.02); }

        /* ПРОГРЕСС 15 УРОВНЕЙ */
        #top-progress { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 8px; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px);}
        .prog-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; transition: 0.5s; position: relative;}
        .prog-dot.done { background: #2ed573; box-shadow: 0 0 10px #2ed573;}
        .prog-dot.disabled { background: #333; opacity: 0.3; }
        .prog-icon-slider { position: absolute; top: -15px; font-size: 24px; transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateX(-50%); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); z-index: 10;}

        /* ВЕРХНИЙ UI */
        #top-ui-left { position: fixed; top: 20px; left: 20px; display: none; gap: 15px; z-index: 9000; }
        #top-ui-right { position: fixed; top: 20px; right: 20px; display: none; gap: 15px; z-index: 9000; align-items: center; }
        #timer-ui, #coin-ui, #egg-ui, #shop-btn { background: rgba(0,0,0,0.8); border: 2px solid; font-size: 24px; font-weight: bold; padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px; font-family: sans-serif; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #timer-ui { border-color: #ff4757; color: #ff4757; display: none; }
        #coin-ui { border-color: #FFD700; color: #FFD700; transition: transform 0.2s; }
        #egg-ui { border-color: #ff9f43; color: #ff9f43; transition: transform 0.2s; }
        #shop-btn { border-color: #00f2ff; color: #00f2ff; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 16px; }
        #shop-btn:hover { transform: scale(1.05); background: #00f2ff; color: #000; }
        
        .timer-danger { animation: bombPulse 0.5s infinite; color: white !important; background: #ff4757 !important; }
        @keyframes bombPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 40px #ff4757; } }
        .coin-pop { animation: popIn 0.3s ease-out; color: white !important; background: #FFD700 !important; }
        .egg-pop { animation: popIn 0.3s ease-out; color: white !important; background: #ff9f43 !important; }

        /* МАГАЗИН */
        #shop-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 99990; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .shop-container { width: 90%; max-width: 900px; background: #1a1a2e; border: 2px solid #00f2ff; border-radius: 20px; padding: 30px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .shop-item { background: #111; border: 2px solid #333; padding: 15px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.3s; position: relative;}
        .shop-item.bought { border-color: #2ed573; opacity: 0.7; }
        .shop-item.active { border-color: #FFD700; box-shadow: 0 0 15px #FFD700; opacity: 1; transform: scale(1.05); z-index: 2;}
        .buy-btn { background: #FFD700; color: #000; border: none; padding: 8px 15px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%;}
        .buy-btn:hover { filter: brightness(1.1); }
        .shop-icon { font-size: 40px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .shop-icon img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px;}

        /* МАСКОТ И ПАСХАЛКИ (УВЕЛИЧЕНО) */
        #mascot { position: fixed; bottom: 20px; right: 30px; font-size: 250px; z-index: 9500; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); display: none; pointer-events: none;}
        #mascot img { width: 350px; height: 350px; object-fit: contain; border-radius: 30px; }
        #prev-mascot img { width: 250px; height: 250px; object-fit: contain; border-radius: 20px; }
        .mascot-idle { animation: mascotBreathe 3s infinite ease-in-out; }
        .mascot-happy { animation: mascotJump 0.5s ease; }
        .mascot-sad { animation: shake 0.4s ease; filter: drop-shadow(0 0 30px red) !important; }
        .mascot-combo { animation: mascotSpin 0.6s ease; filter: drop-shadow(0 0 40px gold) !important; }
        @keyframes mascotBreathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
        @keyframes mascotJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-80px) scale(1.1); } }
        @keyframes mascotSpin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }

        @keyframes floatEgg { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 33% { transform: translateY(-15px) scale(1.1) rotate(15deg); } 66% { transform: translateY(10px) scale(0.9) rotate(-10deg); } }
        #easter-egg { position: fixed; font-size: 30px; opacity: 0.3; cursor: pointer; z-index: 99999; transition: 0.2s; display: none; animation: floatEgg 4s infinite ease-in-out; }
        #easter-egg:hover { animation: none; opacity: 0.8; transform: scale(1.2) rotate(20deg); }

        /* --- ТЕМЫ МАГАЗИНА --- */
        body.theme-gold .word-card, body.theme-gold .sentence-block, body.theme-gold .memory-front, body.theme-gold .bubble-word, body.theme-gold .maze-cell, body.theme-gold .flying-bubble, body.theme-gold .big-text, body.theme-gold #flashlight-area, body.theme-gold .text-builder-top, body.theme-gold .sentence-builder, body.theme-gold .text-with-gaps { border: 2px solid #FFD700 !important; box-shadow: 0 5px 15px rgba(255,215,0,0.2) !important; }
        body.theme-gold .task-title, body.theme-gold .fl-word, body.theme-gold .nav-dot { color: #FFD700 !important; text-shadow: 0 0 10px rgba(255,215,0,0.5) !important; border-color: #FFD700 !important; }
        body.theme-gold .gap.drag-over { border-color: #FFD700 !important; box-shadow: 0 0 20px rgba(255,215,0,0.6) !important; }
        body.theme-gold .play-audio-btn, body.theme-gold .tf-btn { background: #FFD700 !important; color: #000 !important; box-shadow: 0 5px 15px rgba(255,215,0,0.4) !important; }
        body.theme-gold .nav-dot.done { background: #FFD700 !important; color: #000 !important; }

        body.theme-neon { background-color: #050510 !important; }
        body.theme-neon .word-card, body.theme-neon .sentence-block, body.theme-neon .memory-front, body.theme-neon .bubble-word, body.theme-neon .maze-cell, body.theme-neon .flying-bubble, body.theme-neon .big-text, body.theme-neon #flashlight-area, body.theme-neon .text-builder-top, body.theme-neon .sentence-builder, body.theme-neon .text-with-gaps { background: rgba(0, 242, 255, 0.05) !important; border: 2px solid #00f2ff !important; box-shadow: 0 0 15px #00f2ff, inset 0 0 10px #00f2ff !important; color: #00f2ff !important; text-shadow: 0 0 5px #00f2ff !important; }
        body.theme-neon .task-title, body.theme-neon .fl-word, body.theme-neon .nav-dot { color: #00f2ff !important; text-shadow: 0 0 15px #00f2ff !important; border-color: #00f2ff !important; }
        body.theme-neon .gap.drag-over { border-color: #ff00ff !important; box-shadow: 0 0 20px rgba(255,0,255,0.6) !important; background: rgba(255,0,255,0.2) !important;}
        body.theme-neon .play-audio-btn, body.theme-neon .tf-btn { background: #00f2ff !important; color: #000 !important; box-shadow: 0 0 15px #00f2ff !important; }
        body.theme-neon .memory-back, body.theme-neon .maze-cell.active, body.theme-neon .gap.filled, body.theme-neon .nav-dot.done { background: #00f2ff !important; color: #000 !important; box-shadow: 0 0 20px #00f2ff !important; text-shadow: none !important; border-color: #00f2ff !important;}

        body.theme-mc { background-color: #5C4033 !important; font-family: 'Courier New', Courier, monospace !important; }
        body.theme-mc .word-card, body.theme-mc .sentence-block, body.theme-mc .memory-front, body.theme-mc .bubble-word, body.theme-mc .maze-cell, body.theme-mc .flying-bubble, body.theme-mc .big-text, body.theme-mc #flashlight-area, body.theme-mc .text-builder-top, body.theme-mc .sentence-builder, body.theme-mc .text-with-gaps { background: #55AA55 !important; border: 4px solid #333 !important; border-radius: 0 !important; color: white !important; box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3), 4px 4px 0px rgba(0,0,0,0.5) !important; text-shadow: 2px 2px 0px #000 !important; }
        body.theme-mc .task-title, body.theme-mc .fl-word, body.theme-mc .nav-dot { color: #fff !important; text-shadow: 2px 2px 0px #000 !important; border-color: #fff !important; border-radius: 0 !important;}
        body.theme-mc .gap.drag-over { border-color: #fff !important; background: #8B4513 !important; border-radius: 0 !important;}
        body.theme-mc .play-audio-btn, body.theme-mc .tf-btn { background: #8B4513 !important; border: 4px solid #333 !important; border-radius: 0 !important; color: white !important; box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), 4px 4px 0px rgba(0,0,0,0.5) !important; text-shadow: 2px 2px 0px #000 !important; }
        body.theme-mc .memory-back, body.theme-mc .maze-cell.active, body.theme-mc .gap.filled, body.theme-mc .nav-dot.done { background: #8B4513 !important; color: #fff !important; text-shadow: 2px 2px 0px #000 !important; }

        body.theme-sonic { background: radial-gradient(circle, #0050ff, #001a66) !important; font-style: italic !important; }
        body.theme-sonic .word-card, body.theme-sonic .sentence-block, body.theme-sonic .memory-front, body.theme-sonic .bubble-word, body.theme-sonic .maze-cell, body.theme-sonic .flying-bubble, body.theme-sonic .big-text, body.theme-sonic .text-builder-top, body.theme-sonic .sentence-builder, body.theme-sonic .text-with-gaps { background: #E3000F !important; border: 3px solid #FFCC00 !important; border-radius: 25px !important; color: white !important; box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 10px #FFCC00 !important; text-transform: uppercase !important; letter-spacing: 1px;}
